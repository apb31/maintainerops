[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainerops"
version = "0.1.0"
description = "A lightweight GitHub maintenance reporting CLI for open-source maintainers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Angel Peralta"}]
keywords = ["github", "open-source", "maintainers", "triage", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
maintainerops = "maintainerops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
